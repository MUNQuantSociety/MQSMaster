[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mqs_bot"
version = "0.1.0"
authors = [
  { name="MQS", email="munquantsociety@gmail.com" },
]
description = "A quantitative trading bot."
dependencies = [
    "tokenizers>=0.23.3",
    "tqdm>=4.70.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
source = ["src"]
omit = [
  "src/mqs_bot.egg-info/*",
  "*/__pycache__/*",
]
